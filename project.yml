name: MetadataPhotosProbe
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: NO
packages:
  ProbeCore:
    path: .
targets:
  MetadataPhotosProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vxtiglitch.MetadataPhotosProbe
        INFOPLIST_FILE: App/Info.plist
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: ProbeCore
        product: ProbeCore
  MetadataPhotosProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vxtiglitch.MetadataPhotosProbe.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MetadataPhotosProbe
      - package: ProbeCore
        product: ProbeCore
schemes:
  MetadataPhotosProbe:
    build:
      targets:
        MetadataPhotosProbe: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MetadataPhotosProbeTests
    archive:
      config: Release

# Codemagic CI/CD configuration for Metadata Editor iOS
# Target runner: Apple Silicon Mac mini M2 (free tier)
workflows:
  metadata-editor-ios:
    name: Metadata Editor iOS (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.6
      xcode: 16.4
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    cache:
      cache_paths:
        - .tools/flutter-3.47.6
        - $HOME/.pub-cache
    scripts:
      - name: Build and verify Metadata Editor iOS
        script: |
          set -euo pipefail
          bash scripts/build-editor-macos.sh
    artifacts:
      - build/editor/*.ipa
      - build/editor/*.zip
      - build/editor/*.json
      - build/editor/evidence/**
      - build/editor/NativeTests.xcresult/**
